name: Android
on:
  push:
    branches: [feature/android-v2, develop, main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug jacocoTestReport jacocoCoverageVerification
        working-directory: android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-validation
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/tests/
            android/app/build/reports/jacoco/
