name: Desktop

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify, tests and JaCoCo gate
        # Xvfb da pantalla virtual: las pruebas cargan el FXML real y necesitan el motor JavaFX.
        run: xvfb-run --auto-servernum mvn --batch-mode verify
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-jacoco-report
          path: desktop/target/site/jacoco
          if-no-files-found: warn
      - name: Upload fat JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-fat-jar
          path: desktop/target/*.jar
          if-no-files-found: error

  desktop-windows:
    name: Desktop (fat JAR en Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package fat JAR
        # Pruebas y umbral JaCoCo ya se ejecutan en el job desktop (allí con Xvfb);
        # este job solo comprueba que el JAR único se genera también en Windows.
        run: mvn --batch-mode -DskipTests package
      - name: Upload fat JAR (Windows)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-fat-jar-windows
          path: desktop/target/runnersz-desktop.jar
          if-no-files-found: error
