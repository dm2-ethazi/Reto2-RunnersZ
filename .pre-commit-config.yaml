minimum_pre_commit_version: '4.0.1'
default_install_hook_types: [pre-commit, pre-push, commit-msg]
repos:
  - repo: local
    hooks:
      - id: protected-branches
        name: Protect main and develop
        entry: python scripts/check_branch.py
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit, pre-push]
      - id: board-tests
        name: Test board tooling
        entry: uv run --python 3.12 --with pytest python -m pytest scripts/tests -q
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit, pre-push]
      - id: commit-message
        name: Validate institutional commit message
        entry: python scripts/check_commit_message.py
        language: system
        stages: [commit-msg]