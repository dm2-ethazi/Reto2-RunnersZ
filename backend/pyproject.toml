[project]
name = "runnersz-backend"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<0.31",
  "python-multipart>=0.0.9,<0.1",
  "cryptography>=43,<44",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<0.7",
  "isort>=5.13,<6",
  "pre-commit>=3.8,<4",
  "httpx>=0.27,<0.28",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --cov=runnersz --cov-report=term-missing --cov-report=xml --cov-fail-under=80"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# File() y Form() son la firma recomendada por FastAPI para dependencias.
"src/runnersz/routes.py" = ["B008"]

[tool.isort]
profile = "black"
line_length = 88
